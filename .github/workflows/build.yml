name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --windowed --icon="icon.ico" --name "BUG Rating Calculator" bug_calculator.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BUG_Rating_Calculator
          path: dist/BUG Rating Calculator.exe

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BUG Rating Calculator ${{ github.ref_name }}
          files: dist/BUG Rating Calculator.exe
